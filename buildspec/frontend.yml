version: 0.2

phases:
  pre_build:
    commands:
      - echo "Deploying the frontend for this application pipeline execution."
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm --prefix frontend ci
  build:
    commands:
      - npm --prefix frontend run build
  post_build:
    commands:
      - test -n "$VITE_COGNITO_USER_POOL_ID"
      - grep -R -F -q "$VITE_COGNITO_USER_POOL_ID" frontend/dist/assets
      - aws s3 sync frontend/dist/ "s3://$FRONTEND_BUCKET_NAME" --delete
      - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
