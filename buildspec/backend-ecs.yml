version: 0.2

phases:
  pre_build:
    commands:
      - AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - 'AWS_REGION="${AWS_REGION:-$AWS_DEFAULT_REGION}"'
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - 'ROOT_DIR="${CODEBUILD_SRC_DIR:-$PWD}"'
      - |
        if [ ! -d "$ROOT_DIR/.git" ]; then
          echo "Backend ECS builds require CodePipeline SourceOutput to use CODEBUILD_CLONE_REF so CodeBuild receives a full Git clone."
          exit 1
        fi
      - COMMIT_SHA="$(git -C "$ROOT_DIR" rev-parse HEAD)"
      - echo "Evaluating ECS services against deployed image revision $COMMIT_SHA"
  build:
    commands:
      - |
        deploy_service() {
          local key="$1"
          local service_dir="$2"
          local repository_url="$3"
          local ecs_service_name="$4"

          echo "Building $key from $service_dir"
          docker build -t "$repository_url:$COMMIT_SHA" "$service_dir"
          docker push "$repository_url:$COMMIT_SHA"

          task_definition_arn="$(aws ecs describe-services --cluster "$ECS_CLUSTER_NAME" --services "$ecs_service_name" --query 'services[0].taskDefinition' --output text)"
          aws ecs describe-task-definition --task-definition "$task_definition_arn" --query taskDefinition > task-definition.json
          jq --arg IMAGE "$repository_url:$COMMIT_SHA" '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' task-definition.json > new-task-definition.json
          new_task_definition_arn="$(aws ecs register-task-definition --cli-input-json file://new-task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)"
          aws ecs update-service --cluster "$ECS_CLUSTER_NAME" --service "$ecs_service_name" --task-definition "$new_task_definition_arn"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER_NAME" --services "$ecs_service_name"
        }
      - |
        service_has_changes() {
          local service_dir="$1"
          local ecs_service_name="$2"
          local task_definition_arn deployed_image deployed_revision

          task_definition_arn="$(aws ecs describe-services --cluster "$ECS_CLUSTER_NAME" --services "$ecs_service_name" --query 'services[0].taskDefinition' --output text)"
          deployed_image="$(aws ecs describe-task-definition --task-definition "$task_definition_arn" --query 'taskDefinition.containerDefinitions[0].image' --output text)"
          deployed_revision="${deployed_image##*:}"

          if ! git -C "$ROOT_DIR" cat-file -e "${deployed_revision}^{commit}" 2>/dev/null; then
            echo "$ecs_service_name is using $deployed_image, not a source commit image. Deploying it."
            return 0
          fi

          if git -C "$ROOT_DIR" diff --quiet "$deployed_revision" "$COMMIT_SHA" -- "$service_dir"; then
            echo "No changes for $ecs_service_name since deployed revision $deployed_revision."
            return 1
          fi

          echo "Changes found for $ecs_service_name since deployed revision $deployed_revision."
          return 0
        }

        deployed=0
        if service_has_changes services/user-service "$USER_SERVICE_NAME"; then
          deploy_service user services/user-service "$USER_ECR_REPOSITORY_URL" "$USER_SERVICE_NAME"
          deployed=1
        fi
        if service_has_changes services/menu-service "$MENU_SERVICE_NAME"; then
          deploy_service menu services/menu-service "$MENU_ECR_REPOSITORY_URL" "$MENU_SERVICE_NAME"
          deployed=1
        fi
        if service_has_changes services/order-service "$ORDER_SERVICE_NAME"; then
          deploy_service order services/order-service "$ORDER_ECR_REPOSITORY_URL" "$ORDER_SERVICE_NAME"
          deployed=1
        fi
        if [ "$deployed" = "0" ]; then
          echo "No ECS service changes detected."
        fi
