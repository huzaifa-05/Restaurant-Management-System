version: 0.2

phases:
  pre_build:
    commands:
      - |
        if [ ! -d .git ]; then
          echo "Payment Lambda builds require CodePipeline SourceOutput to use CODEBUILD_CLONE_REF so CodeBuild receives a full Git clone."
          exit 1
        fi
      - |
        if git rev-parse HEAD^ >/dev/null 2>&1; then
          CHANGED_FILES="$(git diff --name-only HEAD^ HEAD)"
        else
          CHANGED_FILES="$(git show --pretty="" --name-only HEAD)"
        fi
      - |
        if ! echo "$CHANGED_FILES" | grep -q '^services/payment-service/'; then
          echo "No payment service changes detected."
          exit 0
        fi
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd services/payment-service
      - npm ci
  build:
    commands:
      - node -e "const { handler } = require('./handler'); handler({ rawPath:'/api/payments/webhook', requestContext:{ http:{ method:'POST' } }, body: JSON.stringify({ type:'build.check' }) }).then(r => { if (r.statusCode !== 200) process.exit(1); })"
      - zip -r payment-service.zip . -x "node_modules/.cache/*"
  post_build:
    commands:
      - aws lambda update-function-code --function-name "$PAYMENT_LAMBDA_NAME" --zip-file fileb://payment-service.zip
